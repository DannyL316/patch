name: Update LoL patches
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run update
      - name: Commit patch data if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add data/patches.json
          git commit -m "Update LoL patch data"
          git push
